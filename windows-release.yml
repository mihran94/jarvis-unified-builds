name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
concurrency:
  group: jarvis-windows-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mihran94/JARVIS-AI
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the test suite
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build the unsigned application
        run: |
          python -m pip install pyinstaller==6.12.0
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name JarvisAI --hidden-import keyring.backends.Windows main.py
      - name: Write the release manifest
        shell: bash
        run: |
          python scripts/release_manifest.py dist/JarvisAI dist/JarvisAI-RELEASE.txt --version 0.3.0 --revision "$(git rev-parse HEAD)" --channel beta
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-windows-x64
          path: |
            dist/JarvisAI
            dist/JarvisAI-RELEASE.txt
          retention-days: 14
          if-no-files-found: error
